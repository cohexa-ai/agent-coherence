version: 2
updates:
  # Python dependencies: uv.lock, plus requirements-diagnose.txt, which
  # Dependabot rewrites alongside it because it sits in the same directory.
  #
  # `dev` is the default branch, so version and security updates both open
  # against it, and each entry's settings apply to both kinds. No entry sets
  # `target-branch`: pointed at a non-default branch, it would stop the entry's
  # labels and commit-message settings from applying to security updates.
  #
  # lockfile-only: this is a library, and the bounds in pyproject.toml are what
  # its users may install. Dependabot moves the pins in uv.lock and never
  # rewrites those bounds. A release that needs a pyproject.toml change, such
  # as one past an upper cap, waits for a person.
  #
  # Dependabot rewrites the pins in requirements-diagnose.txt in place without
  # resolving them, and that has left the file uninstallable: a pin another pin
  # rules out, and a new dependency never added. The supply-chain tests fail
  # such a PR and print the command that regenerates the file from uv.lock.
  #
  # No labels are set, so Dependabot keeps its defaults: `dependencies` plus
  # the ecosystem's own label.
  #
  # What merges without a person: dependabot-gate.yml judges each PR and
  # dependabot-merge.yml merges a qualifying one once its checks pass. Only a
  # patch or minor update of the Python lock or the TypeScript fixture
  # qualifies, and a lock update that lowers or removes any package does not.
  # GitHub Actions bumps, majors and grouped updates wait for a person.
  #
  # This file is read from the default branch, so a change takes effect once it
  # reaches `dev`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # The TypeScript fixture the refactor demo type-checks in CI.
  - package-ecosystem: "npm"
    directory: "/examples/refactor_demo/fixture_repo_ts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions versions, pinned by commit SHA in every workflow under
  # .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
