# Publishes server.json to the Official MCP Registry (registry.modelcontextprotocol.io).
#
# Auth is GitHub OIDC rather than `mcp-publisher login github`. OIDC proves THIS
# repository's identity, which is what grants the `io.github.Cohexa-ai/*`
# namespace. The device flow cannot: it authenticates a user through the
# registry's GitHub App, which has no visibility into org membership, so it only
# ever grants the personal namespace — regardless of org role or membership
# visibility. See https://github.com/modelcontextprotocol/registry/issues/398
name: publish-mcp-registry

on:
  # The primary trigger. `release: published` cannot be relied on here: the
  # Release is created by release.yml with the default GITHUB_TOKEN, and GitHub
  # suppresses events from token-created objects to prevent workflow recursion
  # — the event simply never fires (observed on v0.13.0). workflow_run fires on
  # the workflow's completion regardless of what token it used. release.yml
  # orders preflight -> build -> publish-to-PyPI -> github-release, so its
  # success means the version is already live on PyPI — which matters because
  # the registry validates the package (and its `mcp-name` marker) at publish.
  workflow_run:
    workflows: [release]
    types: [completed]
  # Kept for releases published by a human from the GitHub UI, where the event
  # does fire.
  release:
    types: [published]
  # Manual fallback; publishes the latest GitHub release's version.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish server.json to the MCP Registry
    # For workflow_run, only publish after a *successful* release run — a failed
    # or cancelled release must not push metadata for a version PyPI never got.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mints the OIDC token the registry authenticates with
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Which release to publish. On a release event the tag rides in on the
      # event payload; on workflow_run it is the tag that started the
      # release.yml run (its head_branch). Only workflow_dispatch falls back to
      # the latest GitHub release. The latest release is never a pre-release,
      # so resolving workflow_run that way would re-publish the previous
      # final release after a pre-release run.
      #
      # Pre-releases (release.yml marks aN / bN / rcN as such) stay off the
      # registry: the steps below are skipped for them.
      - name: Resolve the released tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${EVENT_RELEASE_TAG:-$WORKFLOW_RUN_TAG}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          prerelease="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)"
          if [ "$prerelease" != "true" ] && [ "$prerelease" != "false" ]; then
            echo "Could not tell whether $tag is a pre-release (got '$prerelease')" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [ "$prerelease" = "true" ]; then
            echo "::notice::$tag is a pre-release; not publishing it to the MCP Registry"
          fi

      # The registry refuses a version it already holds, so the manifest has to
      # track the released version rather than whatever was last committed.
      # Both fields matter: the server version and the pypi package version.
      - name: Sync server.json version to the released tag
        if: steps.release.outputs.prerelease == 'false'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "Publishing version: $version (from tag $RELEASE_TAG)"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        if: steps.release.outputs.prerelease == 'false'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the registry via OIDC
        if: steps.release.outputs.prerelease == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.release.outputs.prerelease == 'false'
        run: ./mcp-publisher publish
