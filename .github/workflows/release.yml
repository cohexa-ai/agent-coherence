# Release workflow: PyPI Trusted Publishers OIDC + PEP 740 attestations + CycloneDX SBOM.
#
# This workflow uses PyPI Trusted Publishers OIDC. End-user trust contract in
# docs/security.md. Maintainer-side pre-release verification gate is documented
# in the local-only SECURITY.md at the repo root.
# Until Trusted Publishers is configured on the PyPI side, the publish step will fail
# by design (fail-closed): we never embed long-lived API tokens in repo secrets.
#
# Triggers on tag push matching v*. The tag itself is the publish trigger; this file
# landing in the repo does not publish anything. A .devN version is never released;
# aN / bN / rcN go to PyPI and become a GitHub pre-release (tools/check_release_tag.py).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  preflight:
    name: Release-readiness preflight
    runs-on: ubuntu-latest

    # ``gh api`` calls into the same repo for environment / branch /
    # tag protection lookups. ``contents: read`` is enough; the
    # default ``GITHUB_TOKEN`` is auto-exposed to ``gh``. Note: the
    # branch-protection endpoint requires admin scope (not available
    # to GITHUB_TOKEN at any permission level — admin scope is a
    # PAT-only capability). The preflight script handles that 403
    # gracefully as a [WARN] skipped check; operators verify branch
    # protection locally with `ccs-check-release` before tag push.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify release-readiness configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_release_readiness.py

  build:
    name: Build distribution and SBOM
    runs-on: ubuntu-latest
    needs: [preflight]

    permissions:
      contents: read

    outputs:
      prerelease: ${{ steps.release-tag.outputs.prerelease }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Fails unless the tag is v{__version__}, and refuses a .devN version
      # outright. For aN / bN / rcN it sets prerelease=true, which the
      # github-release job passes on and publish-mcp.yml reads back from the
      # GitHub release to keep pre-releases off the MCP Registry.
      - name: Verify tag matches package version
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install packaging
          python tools/check_release_tag.py

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine cyclonedx-bom

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install -e ".[diagnose]"
          cyclonedx-py environment > sbom.cyclonedx.json

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package
          path: dist/
          retention-days: 30

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30

  publish:
    name: Publish to PyPI with attestations
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi

    # id-token: write enables OIDC token generation for PyPI Trusted Publishers and
    # PEP 740 attestations. No long-lived PyPI API secret is referenced anywhere
    # in this file.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI (Trusted Publishers OIDC + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          attestations: true

  github-release:
    name: Create GitHub Release with SBOM
    runs-on: ubuntu-latest
    needs: [build, publish]

    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: sbom/

      - name: Create GitHub release with wheel, sdist, and SBOM
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: |
            dist/*
            sbom/sbom.cyclonedx.json
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease }}
