name: ci

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: python -m pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check src/ tests/

  architecture:
    name: Architecture Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run architecture boundary checks
        run: python tools/check_architecture.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,diagnose,mcp]"

      # Node toolchain for the refactor-demo's TypeScript fixture. Without
      # this, _has_tsc() in tests/test_refactor_demo.py is False and all real
      # tsc end-to-end tests silently skip, leaving the demo's central
      # correctness claim unverified in CI.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"

      - name: Install refactor-demo TS fixture dependencies
        working-directory: examples/refactor_demo/fixture_repo_ts
        run: npm ci

      - name: Run test suite
        run: pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    needs: [architecture]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmark regression smoke
        run: python tools/benchmark_regression_smoke.py

  benchmark-regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and LangGraph benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[langgraph,benchmark]"

      - name: Run benchmarks
        run: make benchmark

      - name: Check benchmark regression
        run: python tools/benchmark_drift_check.py

  tla-check:
    name: TLA+ Model Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Run TLC model checker
        run: make tla-check

  protocol-corpus:
    name: Protocol Corpus (Python ↔ Node parity)
    runs-on: ubuntu-latest
    needs: [architecture]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"

      - name: Install library + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Which Node backend does this gate prove parity against?
      #
      # Pinning `main` unconditionally makes a PAIRED cross-repo change
      # unverifiable before merge: the sibling Node half sits on its own
      # plugin branch, so every fixture the pair adds fails here until a
      # plugin release promotes dev to main — long after review. The pair is
      # then merged on a maintainer's local run, which is the one place the
      # parity contract must not be taken on trust.
      #
      # So: build the plugin branch whose name matches the branch under
      # test — the PR's head branch on pull_request (`head_ref`), the pushed
      # branch on push (`ref_name`, so a push to `dev` pairs with the
      # plugin's `dev` and a push to `main` with its `main`). With no
      # same-named plugin branch, fall back to the plugin branch named like
      # the line the change is heading for: a PR into `dev` (`base_ref`) and
      # a hand-dispatched run on a feature branch -- stacked PRs get no PR
      # checks, so their CI is dispatched -- pair with the plugin's `dev`,
      # because that is what this repo's `dev` push will pair with after the
      # merge. A PR into `main`, a dispatch on `main` and a tag fall back to
      # the plugin's `main` (no plugin branch is named `v*`). An absent or
      # unreachable fallback degrades to `main` rather than failing the job.
      #
      # `head_ref` is attacker-controlled on a fork PR, so it reaches the
      # script through the environment and is never interpolated into it.
      - name: Resolve plugin ref
        id: plugin_ref
        env:
          SIBLING_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          remote=https://github.com/Cohexa-ai/agent-coherence-plugin.git
          ref=main
          # Whether we FELL BACK is a property of the path taken, not of the
          # value landed on: a push to this repo's `main` pairs with the
          # plugin's `main` deliberately (see above), so `$ref = main` alone
          # cannot tell the intended pairing from a fallback.
          fellback=yes
          if [ -n "$SIBLING_REF" ] &&
             git ls-remote --exit-code --heads "$remote" "$SIBLING_REF" \
               >/dev/null 2>&1; then
            ref="$SIBLING_REF"
            fellback=no
          else
            # The fallback follows the integration line: `dev` for a PR into
            # `dev` or a dispatch on a non-`main` branch, `main` otherwise.
            fallback=main
            if [ "$BASE_REF" = dev ] ||
               { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$REF_NAME" != main ]; }; then
              fallback=dev
            fi
            if [ "$fallback" != main ] &&
               git ls-remote --exit-code --heads "$remote" "$fallback" \
                 >/dev/null 2>&1; then
              ref="$fallback"
            fi
          fi
          # Record the SHA too: the sibling branch can move without a commit
          # here, so the ref name alone does not identify what was proven.
          sha=$(git ls-remote "$remote" "refs/heads/$ref" | cut -f1)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Node backend: agent-coherence-plugin@$ref ($sha)"
          # When this is the FALLBACK, say how far behind it is. "Parity
          # proven against `main`" is true and reads like reassurance, and a
          # `main` trailing the plugin's own `dev` by a release is a weaker
          # claim than it sounds -- the reader cannot tell the difference
          # from the ref name, and this job's whole job is to be believable.
          # Advisory only: every failure path below leaves $note empty, so a
          # rate-limited or unreachable API never turns a passing parity run
          # red. `|| true` is load-bearing under the default `bash -e`.
          note=""
          if [ "$fellback" = yes ] && [ "$ref" = dev ]; then
            note=" — the fallback, the plugin's \`dev\` (the line this change merges into)"
          elif [ "$fellback" = yes ]; then
            # `.ahead_by` on a three-dot compare is how far `dev` leads, i.e.
            # how far `main` trails. `.behind_by` would report the opposite
            # and is wrong here -- today the two are diverged (33 / 2).
            behind=$(curl -sS --max-time 10 -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/Cohexa-ai/agent-coherence-plugin/compare/main...dev" \
              2>/dev/null | jq -r '.ahead_by // empty' 2>/dev/null || true)
            # Three outcomes, kept distinct. Folding the first into the second
            # would let a rate-limited lookup read as reassurance -- the exact
            # bare sentence this note exists to qualify.
            case "$behind" in
              ''|*[!0-9]*) note=" — the fallback; staleness check unavailable" ;;
              0)           note=" — the fallback, level with the plugin's \`dev\`" ;;
              *)           note=" — the fallback, $behind commit(s) behind the plugin's \`dev\`" ;;
            esac
          fi
          echo "Parity proven against \`agent-coherence-plugin@$ref\` \`$sha\`$note." \
            >> "$GITHUB_STEP_SUMMARY"

      # Check out the plugin repo INSIDE the workspace so actions/checkout
      # accepts the path (it rejects paths outside $GITHUB_WORKSPACE). The
      # harness's resolve_node_dist_path() picks up the explicit env var below
      # rather than the sibling-fallback path.
      - name: Check out agent-coherence-plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: Cohexa-ai/agent-coherence-plugin
          ref: ${{ steps.plugin_ref.outputs.ref }}
          path: _plugin_checkout

      - name: Build Node coordinator
        working-directory: _plugin_checkout
        run: |
          npm ci
          npm run build

      - name: Run protocol corpus
        env:
          AGENT_COHERENCE_PLUGIN_DIST_PATH: ${{ github.workspace }}/_plugin_checkout/dist/coordinator.js
        run: pytest -m protocol_corpus -v --tb=short

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, architecture, test, benchmark-smoke, benchmark-regression, tla-check]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package
          path: dist/
          retention-days: 14
