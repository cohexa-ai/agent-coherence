name: ci
# Only a run the weekly scheduler dispatched carries a tag; for every other
# run this is empty, and GitHub falls back to its default run name.
run-name: ${{ inputs.run_tag && format('Weekly full CI ({0})', inputs.run_tag) || '' }}

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_tag:
        description: Set by the weekly full run so it can find the run it dispatched; leave empty.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# A new push to a PR supersedes its running checks, so only PR runs cancel
# each other. Every other run gets a group of its own: pushes to `main` and
# `dev`, tag pushes and dispatches can share a commit, and a group keyed on
# the commit would let one of them silently cancel another's pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  # Keep equal to the length of the test-shards jobs' `shard` matrix.
  TEST_SHARD_COUNT: "2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: python -m pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check src/ tests/

  architecture:
    name: Architecture Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run architecture boundary checks
        run: python tools/check_architecture.py

  # Decides what the rest of the run checks. It never fails: every output
  # is written on every run, and an empty one means "run" (tools/ci_plan.py).
  # Jobs that read an output must list this job in `needs`; GitHub hides a
  # job's outputs from jobs that do not.
  plan:
    name: Plan checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tested-tree: ${{ steps.plan.outputs.tested-tree }}
      tla-needed: ${{ steps.plan.outputs.tla-needed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide what this run checks
        id: plan
        run: python3 tools/ci_plan.py

  # Each Python version's suite runs as TEST_SHARD_COUNT shards (pytest-split,
  # balanced by tests/.test_durations), each in a parallel and a serial lane
  # (tests/conftest.py). The required checks are the `Tests (Python 3.x)`
  # gates after them, not these matrix jobs: a matrix job skipped as a whole
  # reports an unexpanded name, so a required name there could never report.
  test-shards-py311:
    name: Test shard ${{ matrix.shard }} (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan]
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,diagnose,mcp]"

      # Node toolchain for the refactor-demo's TypeScript fixture. Without
      # this, _has_tsc() in tests/test_refactor_demo.py is False and all real
      # tsc end-to-end tests silently skip, leaving the demo's central
      # correctness claim unverified in CI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"

      - name: Install refactor-demo TS fixture dependencies
        working-directory: examples/refactor_demo/fixture_repo_ts
        run: npm ci

      # --node-id-dir=DIR must stay one argument: pytest reads an existing
      # DIR given separately as a test path, and the serial lane writes into
      # the directory the parallel lane created (tests/conftest.py).
      - name: Run the parallel lane
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          pytest -q -n 4 --dist worksteal --test-lane parallel
          --splits "$TEST_SHARD_COUNT" --group "$SHARD" --durations-path tests/.test_durations
          "--node-id-dir=lists/shard-$SHARD" "--junitxml=lists/shard-$SHARD/junit-parallel.xml"

      # Runs after a parallel-lane failure too, but not after a cancel or a
      # timeout, so every failure in the shard shows up in one run.
      - name: Run the serial lane
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          pytest -q -n 0 --test-lane serial
          --splits "$TEST_SHARD_COUNT" --group "$SHARD" --durations-path tests/.test_durations
          "--node-id-dir=lists/shard-$SHARD" "--junitxml=lists/shard-$SHARD/junit-serial.xml"

      - name: Upload node-id lists and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-py3.11-shard-${{ matrix.shard }}
          path: lists/shard-${{ matrix.shard }}
          overwrite: true
          retention-days: 14

  test-shards-py312:
    name: Test shard ${{ matrix.shard }} (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan]
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,diagnose,mcp]"

      # Node toolchain for the refactor-demo's TypeScript fixture. Without
      # this, _has_tsc() in tests/test_refactor_demo.py is False and all real
      # tsc end-to-end tests silently skip, leaving the demo's central
      # correctness claim unverified in CI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"

      - name: Install refactor-demo TS fixture dependencies
        working-directory: examples/refactor_demo/fixture_repo_ts
        run: npm ci

      # --node-id-dir=DIR must stay one argument: pytest reads an existing
      # DIR given separately as a test path, and the serial lane writes into
      # the directory the parallel lane created (tests/conftest.py).
      - name: Run the parallel lane
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          pytest -q -n 4 --dist worksteal --test-lane parallel
          --splits "$TEST_SHARD_COUNT" --group "$SHARD" --durations-path tests/.test_durations
          "--node-id-dir=lists/shard-$SHARD" "--junitxml=lists/shard-$SHARD/junit-parallel.xml"

      # Runs after a parallel-lane failure too, but not after a cancel or a
      # timeout, so every failure in the shard shows up in one run.
      - name: Run the serial lane
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          pytest -q -n 0 --test-lane serial
          --splits "$TEST_SHARD_COUNT" --group "$SHARD" --durations-path tests/.test_durations
          "--node-id-dir=lists/shard-$SHARD" "--junitxml=lists/shard-$SHARD/junit-serial.xml"

      - name: Upload node-id lists and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-py3.12-shard-${{ matrix.shard }}
          path: lists/shard-${{ matrix.shard }}
          overwrite: true
          retention-days: 14

  # The gates carry the required check names. They run under always() and
  # pass only when every shard succeeded and the shards' node-id lists prove
  # each collected test ran exactly once (tools/ci_gate_verdict.py).
  tests-py311:
    name: Tests (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test-shards-py311]
    if: ${{ always() }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download every shard's lists
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: test-results-py3.11-shard-*
          path: shards

      - name: Check that the shards ran every test exactly once
        id: coverage
        run: |
          set +e
          python3 tools/check_shard_coverage.py --root shards --shards "$TEST_SHARD_COUNT" > coverage.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat coverage.txt
          {
            echo "### Test coverage across shards (Python 3.11)"
            echo '```'
            cat coverage.txt
            python3 tools/summarize_junit.py shards
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide the verdict
        env:
          SHARDS: ${{ needs.test-shards-py311.result }}
          COVERAGE_EXIT: ${{ steps.coverage.outputs.exit }}
        run: python3 tools/ci_gate_verdict.py tests --shards "$SHARDS" --coverage-exit "$COVERAGE_EXIT"

  tests-py312:
    name: Tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test-shards-py312]
    if: ${{ always() }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download every shard's lists
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: test-results-py3.12-shard-*
          path: shards

      - name: Check that the shards ran every test exactly once
        id: coverage
        run: |
          set +e
          python3 tools/check_shard_coverage.py --root shards --shards "$TEST_SHARD_COUNT" > coverage.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat coverage.txt
          {
            echo "### Test coverage across shards (Python 3.12)"
            echo '```'
            cat coverage.txt
            python3 tools/summarize_junit.py shards
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide the verdict
        env:
          SHARDS: ${{ needs.test-shards-py312.result }}
          COVERAGE_EXIT: ${{ steps.coverage.outputs.exit }}
        run: python3 tools/ci_gate_verdict.py tests --shards "$SHARDS" --coverage-exit "$COVERAGE_EXIT"

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [plan]
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmark regression smoke
        run: python tools/benchmark_regression_smoke.py

  benchmark-regression:
    name: Benchmark Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and LangGraph benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[langgraph,benchmark]"

      - name: Run benchmarks
        run: make benchmark

      - name: Check benchmark regression
        run: python tools/benchmark_drift_check.py

  # TLA+ runs as three bins in parallel (Makefile tla-check-1..3, which
  # together are `make tla-check`'s nine specs with the same configs). Only a
  # pull request that leaves every TLA+ input alone skips them: the condition
  # needs both the pull_request event and the plan's exact `false`, so an
  # empty or missing output runs them (tools/ci_plan.py).
  tla-bins:
    name: TLA+ bin ${{ matrix.bin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan]
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && needs.plan.outputs.tla-needed == 'false') }}

    strategy:
      fail-fast: false
      matrix:
        bin: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Run TLC on this bin's specs
        env:
          BIN: ${{ matrix.bin }}
        run: make "tla-check-$BIN"

  # Carries the required check name. Passes when every bin passed, or when
  # a pull request's plan said in exactly `false` that no TLA+ input changed
  # (tools/ci_gate_verdict.py); a skip on any other event fails.
  tla-check:
    name: TLA+ Model Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [plan, tla-bins]
    if: ${{ always() }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Decide the verdict
        env:
          BINS: ${{ needs.tla-bins.result }}
          EVENT: ${{ github.event_name }}
          PLAN: ${{ needs.plan.result }}
          TLA_NEEDED: ${{ needs.plan.outputs.tla-needed }}
        run: python3 tools/ci_gate_verdict.py tla --bins "$BINS" --event "$EVENT" --plan "$PLAN" --tla-needed "$TLA_NEEDED"

  protocol-corpus:
    name: Protocol Corpus (Python ↔ Node parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install library + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Which Node backend does this gate prove parity against? The plugin
      # branch named like the branch under test, else the plugin branch of
      # the line the change merges into; the script holds the rules and
      # why. The folding job runs the same step, so both pick the plugin
      # branch by the same rules; each picks it on its own, so a push to
      # that branch between the two can hand them different commits.
      #
      # `head_ref` is attacker-controlled on a fork PR, so it reaches the
      # script through the environment and is never interpolated into it.
      - name: Resolve plugin ref
        id: plugin_ref
        env:
          SIBLING_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-plugin-ref.sh

      # Check out the plugin repo INSIDE the workspace so actions/checkout
      # accepts the path (it rejects paths outside $GITHUB_WORKSPACE). The
      # harness's resolve_node_dist_path() picks up the explicit env var below
      # rather than the sibling-fallback path.
      - name: Check out agent-coherence-plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Cohexa-ai/agent-coherence-plugin
          ref: ${{ steps.plugin_ref.outputs.ref }}
          path: _plugin_checkout

      # After the plugin checkout, so its lockfile exists to key the npm
      # cache on. Node 22 because the plugin's `engines` require it (on 20,
      # `npm ci` warns EBADENGINE).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _plugin_checkout/package-lock.json

      - name: Build Node coordinator
        working-directory: _plugin_checkout
        run: |
          npm ci
          npm run build

      - name: Run protocol corpus
        env:
          AGENT_COHERENCE_PLUGIN_DIST_PATH: ${{ github.workspace }}/_plugin_checkout/dist/coordinator.js
        run: pytest -m protocol_corpus -v --tb=short

  # Every other job runs on Ubuntu, whose disk folds no file name, so there
  # the folding suites and the corpus only see a disk that keeps every
  # spelling apart. This job runs them on the runner's case-insensitive APFS
  # disk, where one file has many spellings. Naming the expected profile
  # makes the probe test in tests/test_fs_profile.py FAIL, never skip, when
  # the runner's disk does not classify as caseless.
  #
  # Pinned to a named image, as ubuntu-24.04 is: `macos-latest` moves to a
  # new macOS (and APFS) on GitHub's schedule, not this repo's. macos-26 is
  # the newest GA image, the one `macos-latest` names today.
  #
  # Its steps are the corpus job's plus the folding step
  # (tests/test_ci_workflow_structure.py holds them equal), so it picks and
  # builds the plugin branch by the same rules. Like the corpus job it needs
  # nothing.
  folding-macos:
    name: Folding tests (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      AGENT_COHERENCE_EXPECT_FOLD_PROFILE: caseless

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install library + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The same step as the corpus job's: `head_ref` reaches the script
      # through the environment only.
      - name: Resolve plugin ref
        id: plugin_ref
        env:
          SIBLING_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-plugin-ref.sh

      - name: Check out agent-coherence-plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Cohexa-ai/agent-coherence-plugin
          ref: ${{ steps.plugin_ref.outputs.ref }}
          path: _plugin_checkout

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _plugin_checkout/package-lock.json

      - name: Build Node coordinator
        working-directory: _plugin_checkout
        run: |
          npm ci
          npm run build

      # Each suite here takes another branch, or stops skipping, on a disk
      # that folds names: the new fold suites, the hook client's link and
      # root tests, the CLI's root-spelling test and the volume's
      # other-spelling tests. Whole files, so no selection can go stale.
      - name: Run the folding tests on the runner's disk
        run: >-
          pytest -v -rs --tb=short
          tests/test_path_fold.py
          tests/test_fs_profile.py
          tests/test_disk_spelling.py
          tests/test_registry_fold_merge.py
          tests/test_coordinator_door_fold.py
          tests/test_policy_fold.py
          tests/test_foreign_write_detector_fold.py
          tests/test_coordinator_session_fold.py
          tests/adapters/test_coherent_volume_fold.py
          tests/test_claude_code_hook_client.py
          tests/test_claude_code_cli.py
          tests/adapters/test_coherent_volume_other_holder.py
          tests/adapters/test_coherent_volume_release.py

      # Runs after a folding failure too, so one run shows both.
      - name: Run protocol corpus
        if: ${{ !cancelled() }}
        env:
          AGENT_COHERENCE_PLUGIN_DIST_PATH: ${{ github.workspace }}/_plugin_checkout/dist/coordinator.js
        run: pytest -m protocol_corpus -v --tb=short

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [plan]
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package
          path: dist/
          retention-days: 14
